<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Taller · Del problema biológico al dato</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="barra-superior">
    <p class="marca">Taller de secuenciación · Genómica UV</p>
    <div class="progreso" id="zona-progreso" hidden>
      <label for="progreso" id="etiqueta-progreso">Paso 1 de 8</label>
      <progress id="progreso" max="8" value="1"></progress>
    </div>
  </header>

  <main id="app">
    <noscript>Esta página necesita JavaScript activado.</noscript>
  </main>

  <nav class="barra-inferior" id="navegacion" aria-label="Navegación entre pasos" hidden>
    <button type="button" id="btn-atras" class="secundario">Atrás</button>
    <button type="button" id="btn-siguiente" class="primario">Siguiente</button>
  </nav>

  <p class="aviso" id="aviso" role="status" aria-live="polite"></p>
</body>
</html>
